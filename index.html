<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>حاسبة الطاقة الشمسية</title>

  <link rel="stylesheet" href="src/style.css" />

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

</head>

<body>

  <!-- HERO -->

  <header class="hero">

    <div class="hero-content">

      <div class="badge">
        ⚡ فادي لانظمة الشمسية
      </div>

      <h1>
        احسب منظومتك الشمسية خلال دقيقة
      </h1>

      <p>
        اختر أجهزتك واحصل فورًا على عدد الألواح والبطاريات والانفيرتر المناسب.
      </p>

      <button class="cta-btn" onclick="goStep(1)">
        ابدأ الآن
      </button>

    </div>

  </header>

  <!-- APP -->

  <main class="container">

    <!-- STEPPER -->

    <div class="stepper">

      <div class="step active" id="step-1">
        <span>1</span>
        الأجهزة
      </div>

      <div class="step" id="step-2">
        <span>2</span>
        التشغيل
      </div>

      <div class="step" id="step-3">
        <span>3</span>
        النتائج
      </div>

    </div>

    <!-- STEP 1 -->

    <section class="panel active" id="panel-1">

      <div class="section-head">

        <h2>اختر الأجهزة</h2>

        <p>
          اضغط على أي جهاز لإضافته
        </p>

      </div>

      <div class="catalog" id="catalog"></div>

    </section>

    <!-- STEP 2 -->

    <section class="panel" id="panel-2">

      <div class="section-head">

        <h2>ساعات التشغيل</h2>

        <p>
          حدد عدد الأجهزة وساعات التشغيل
        </p>

      </div>

      <div id="devices"></div>

    </section>

    <!-- STEP 3 -->

    <section class="panel" id="panel-3">

      <div class="section-head">

        <h2>نتائج الحساب</h2>

        <p>
          النظام المقترح لمنزلك
        </p>

      </div>

      <div class="results-grid" id="results"></div>

      <!-- whatsapp -->

      <button class="whatsapp-btn" onclick="sendWhatsApp()">

        <i class="fab fa-whatsapp"></i>

        إرسال النتائج عبر واتساب

      </button>

    </section>

  </main>

  <!-- bottom -->

  <div class="bottom-bar">

    <button class="secondary-btn" onclick="prevStep()">
      رجوع
    </button>

    <button class="primary-btn" onclick="nextStep()">
      التالي
    </button>

  </div>

  <script src="src/script.js"></script>

</body>

</html>
